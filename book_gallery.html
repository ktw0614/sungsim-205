<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학급 북 갤러리 아카이브</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Pretendard Variable"', 'Pretendard', '-apple-system', 'sans-serif'] },
                    colors: {
                        gallery: {
                            bg: '#f8f9fa',
                            surface: '#ffffff',
                            primary: '#ec4899', // pink로 화사하게 변경
                            text: '#212529',
                            muted: '#6c757d'
                        }
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
                        'pop': 'pop 0.3s ease-out forwards'
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        pop: {
                            '0%': { transform: 'scale(0.9)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            /* 기존 회색 배경에서 화사한 파스텔 그라데이션으로 변경 */
            background: linear-gradient(135deg, #fff1f2 0%, #f0fdfa 50%, #eff6ff 100%);
            background-attachment: fixed;
            color: #1e293b;
            min-height: 100vh;
        }

        /* 핀터레스트 스타일 핀(카드) 호버 효과 */
        .pin-card {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            break-inside: avoid;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255,255,255,0.8);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }
        .pin-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(236, 72, 153, 0.15), 0 10px 10px -5px rgba(236, 72, 153, 0.05);
        }
        .pin-card img {
            transition: filter 0.3s;
        }
        .pin-card:hover img {
            filter: brightness(0.9);
        }

        /* 글래스모피즘 모달 배경 */
        .glass-overlay {
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

        /* 파일 업로드 라벨 스타일링 */
        .file-upload-label {
            border: 2px dashed #fbcfe8; /* 핑크톤 테두리 */
            background-color: rgba(255, 255, 255, 0.5);
            transition: all 0.3s;
        }
        .file-upload-label:hover {
            border-color: #ec4899;
            background-color: #fdf2f8;
        }

        /* 스크롤바 숨기기 (필터 버튼용) */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="antialiased pb-20 md:pb-8">

    <!-- 토스트 알림 컨테이너 -->
    <div id="toast-container" class="fixed top-6 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-3"></div>

    <header class="bg-white/70 backdrop-blur-md sticky top-0 z-30 border-b border-pink-100 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex flex-col lg:flex-row justify-between items-center gap-4">
                <div class="text-center lg:text-left shrink-0">
                    <span class="bg-gradient-to-r from-pink-100 to-purple-100 text-pink-600 text-xs font-bold px-3 py-1 rounded-full mb-2 inline-block shadow-sm">독서 연계 자율활동</span>
                    <h1 class="text-2xl md:text-3xl font-black text-slate-800 tracking-tight flex items-center justify-center lg:justify-start gap-2">
                        <i class="fa-solid fa-camera-retro text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-violet-500"></i> 북 갤러리 아카이브
                    </h1>
                </div>
                
                <!-- 해시태그 필터 (장르 대폭 추가) -->
                <div class="flex flex-nowrap lg:flex-wrap justify-start lg:justify-center gap-2 overflow-x-auto hide-scrollbar py-2 w-full lg:w-auto">
                    <button onclick="filterGallery('전체')" class="filter-btn active bg-gradient-to-r from-pink-500 to-violet-500 text-white border-transparent px-4 py-2 rounded-full text-sm font-bold shadow-md transition-all shrink-0">전체보기</button>
                    <button onclick="filterGallery('문학')" class="filter-btn bg-white/80 text-slate-600 border border-slate-200 hover:bg-pink-50 hover:text-pink-600 px-4 py-2 rounded-full text-sm font-bold transition-all shrink-0">#문학</button>
                    <button onclick="filterGallery('사회/이슈')" class="filter-btn bg-white/80 text-slate-600 border border-slate-200 hover:bg-pink-50 hover:text-pink-600 px-4 py-2 rounded-full text-sm font-bold transition-all shrink-0">#사회/이슈</button>
                    <button onclick="filterGallery('과학/환경')" class="filter-btn bg-white/80 text-slate-600 border border-slate-200 hover:bg-pink-50 hover:text-pink-600 px-4 py-2 rounded-full text-sm font-bold transition-all shrink-0">#과학/환경</button>
                    <button onclick="filterGallery('심리/진로')" class="filter-btn bg-white/80 text-slate-600 border border-slate-200 hover:bg-pink-50 hover:text-pink-600 px-4 py-2 rounded-full text-sm font-bold transition-all shrink-0">#심리/진로</button>
                    <!-- 신규 장르 추가 -->
                    <button onclick="filterGallery('역사/철학')" class="filter-btn bg-white/80 text-slate-600 border border-slate-200 hover:bg-pink-50 hover:text-pink-600 px-4 py-2 rounded-full text-sm font-bold transition-all shrink-0">#역사/철학</button>
                    <button onclick="filterGallery('예술/문화')" class="filter-btn bg-white/80 text-slate-600 border border-slate-200 hover:bg-pink-50 hover:text-pink-600 px-4 py-2 rounded-full text-sm font-bold transition-all shrink-0">#예술/문화</button>
                    <button onclick="filterGallery('경제/경영')" class="filter-btn bg-white/80 text-slate-600 border border-slate-200 hover:bg-pink-50 hover:text-pink-600 px-4 py-2 rounded-full text-sm font-bold transition-all shrink-0">#경제/경영</button>
                    <button onclick="filterGallery('에세이')" class="filter-btn bg-white/80 text-slate-600 border border-slate-200 hover:bg-pink-50 hover:text-pink-600 px-4 py-2 rounded-full text-sm font-bold transition-all shrink-0">#에세이</button>
                </div>
            </div>
        </div>
    </header>

    <!-- 메인 갤러리 영역 (Masonry 레이아웃) -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- 소개 문구 -->
        <div class="text-center mb-10 max-w-2xl mx-auto animate-fade-in-up">
            <h2 class="text-xl font-bold text-gray-700 mb-2">우리의 시선이 머문 문장들</h2>
            <p class="text-gray-500">친구들이 다양한 도구(캔바, 굿노트 등)로 자유롭게 디자인한 북카드를 감상하고 소통해보세요. 이미지를 클릭하면 자세히 볼 수 있습니다.</p>
        </div>

        <div id="gallery-grid" class="columns-1 sm:columns-2 md:columns-3 lg:columns-4 gap-6 space-y-6">
            <!-- 자바스크립트를 통해 카드들이 여기에 렌더링됩니다 -->
        </div>

        <!-- 빈 상태 표시 -->
        <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-gray-400">
            <i class="fa-regular fa-folder-open text-6xl mb-4"></i>
            <p class="text-lg font-medium">해당하는 북카드가 없습니다.</p>
        </div>
    </main>

    <!-- 플로팅 액션 버튼 (업로드 화사하게 변경) -->
    <button onclick="openUploadModal()" class="fixed bottom-6 right-6 md:bottom-10 md:right-10 bg-gradient-to-r from-pink-500 to-violet-500 text-white w-16 h-16 rounded-full shadow-2xl flex items-center justify-center text-2xl hover:scale-110 transition-transform z-40 group border-2 border-white/50">
        <i class="fa-solid fa-plus group-hover:rotate-90 transition-transform duration-300"></i>
    </button>

    <div id="upload-modal" class="fixed inset-0 glass-overlay z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-lg shadow-2xl overflow-hidden animate-pop flex flex-col max-h-[90vh]">
            
            <div class="flex justify-between items-center p-6 border-b border-gray-100">
                <h3 class="text-xl font-bold text-gray-800"><i class="fa-solid fa-palette text-pink-500 mr-2"></i> 내 북카드 전시하기</h3>
                <button onclick="closeUploadModal()" class="text-gray-400 hover:text-pink-500 transition-colors">
                    <i class="fa-solid fa-xmark text-2xl"></i>
                </button>
            </div>
            
            <div class="p-6 overflow-y-auto">
                <form id="upload-form" onsubmit="submitCard(event)" class="space-y-5">
                    
                    <!-- 이미지 업로드 -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">북카드 이미지 (JPG, PNG)</label>
                        <label for="image-upload" class="file-upload-label flex flex-col items-center justify-center w-full h-40 rounded-2xl cursor-pointer bg-gray-50 overflow-hidden relative">
                            <div id="upload-placeholder" class="flex flex-col items-center justify-center pt-5 pb-6">
                                <i class="fa-regular fa-image text-4xl text-gray-400 mb-3"></i>
                                <p class="mb-2 text-sm text-gray-500"><span class="font-bold">클릭하여 업로드</span></p>
                            </div>
                            <!-- 썸네일 미리보기 -->
                            <img id="image-preview" class="hidden absolute inset-0 w-full h-full object-cover" />
                            <input id="image-upload" type="file" accept="image/*" class="hidden" onchange="previewImage(event)" required />
                        </label>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">도서명</label>
                            <input type="text" id="up-title" required class="w-full px-4 py-3 rounded-xl bg-gray-50 border-transparent focus:border-indigo-500 focus:bg-white focus:ring-0 transition-colors text-sm" placeholder="예: 데미안">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">제작자(이름)</label>
                            <input type="text" id="up-creator" required class="w-full px-4 py-3 rounded-xl bg-gray-50 border-transparent focus:border-indigo-500 focus:bg-white focus:ring-0 transition-colors text-sm" placeholder="이름을 입력하세요">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">카테고리 태그</label>
                        <select id="up-tag" class="w-full px-4 py-3 rounded-xl bg-gray-50 border-transparent focus:border-pink-500 focus:bg-white focus:ring-0 transition-colors text-sm text-gray-700">
                            <option value="문학">#문학</option>
                            <option value="사회/이슈">#사회/이슈</option>
                            <option value="과학/환경">#과학/환경</option>
                            <option value="심리/진로">#심리/진로</option>
                            <!-- 신규 장르 옵션 추가 -->
                            <option value="역사/철학">#역사/철학</option>
                            <option value="예술/문화">#예술/문화</option>
                            <option value="경제/경영">#경제/경영</option>
                            <option value="에세이">#에세이</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">도슨트 코멘트 (기획 의도)</label>
                        <textarea id="up-desc" rows="3" required class="w-full px-4 py-3 rounded-xl bg-gray-50 border-transparent focus:border-pink-500 focus:bg-white focus:ring-0 transition-colors text-sm resize-none" placeholder="이 책을 고른 이유나 디자인 기획 의도를 짧게 남겨주세요."></textarea>
                    </div>
                    
                    <button type="submit" class="w-full bg-gradient-to-r from-pink-500 to-violet-500 hover:opacity-90 text-white font-bold py-4 rounded-xl shadow-lg transition-all mt-2">
                        갤러리에 화사하게 전시하기
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div id="detail-modal" class="fixed inset-0 glass-overlay z-50 hidden flex items-center justify-center p-4 md:p-10">
        <button onclick="closeDetailModal()" class="absolute top-6 right-6 text-white hover:text-red-400 transition-colors z-50">
            <i class="fa-solid fa-xmark text-4xl"></i>
        </button>

        <div class="bg-white rounded-3xl w-full max-w-5xl shadow-2xl overflow-hidden flex flex-col md:flex-row max-h-full animate-pop">
            
            <!-- 왼쪽: 이미지 확대 영역 -->
            <div class="w-full md:w-3/5 bg-gray-100 flex items-center justify-center p-4 relative h-64 md:h-auto overflow-hidden">
                <img id="detail-img" src="" alt="Book Card" class="max-w-full max-h-full object-contain rounded-lg shadow-sm">
            </div>

            <!-- 오른쪽: 정보 및 댓글 영역 -->
            <div class="w-full md:w-2/5 flex flex-col h-full bg-white border-l border-gray-100">
                <!-- 정보 헤더 -->
                <div class="p-6 border-b border-gray-100">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <span id="detail-tag" class="text-xs font-bold text-pink-600 bg-pink-50 border border-pink-100 px-2 py-1 rounded-md mb-2 inline-block">#태그</span>
                            <h2 id="detail-title" class="text-2xl font-black text-gray-800 leading-tight">도서명</h2>
                        </div>
                        <button id="detail-like-btn" class="flex flex-col items-center text-gray-400 hover:text-pink-500 transition-colors">
                            <i class="fa-solid fa-heart text-2xl mb-1"></i>
                            <span id="detail-like-count" class="text-xs font-bold">0</span>
                        </button>
                    </div>
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center text-gray-500 font-bold">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <div>
                            <p id="detail-creator" class="text-sm font-bold text-gray-800">제작자</p>
                            <p class="text-xs text-gray-500">Design Creator</p>
                        </div>
                    </div>
                    <!-- 도슨트 코멘트 -->
                    <div class="bg-gray-50 p-4 rounded-xl">
                        <p class="text-xs font-bold text-gray-500 mb-1"><i class="fa-solid fa-quote-left"></i> 도슨트 코멘트</p>
                        <p id="detail-desc" class="text-sm text-gray-700 leading-relaxed">기획 의도 내용이 들어갑니다.</p>
                    </div>
                </div>

                <!-- 댓글 리스트 -->
                <div id="comment-list" class="flex-1 p-6 overflow-y-auto flex flex-col gap-4 bg-white min-h-[200px]">
                    <!-- 댓글이 렌더링 됩니다 -->
                </div>

                <!-- 댓글 입력 폼 -->
                <div class="p-4 border-t border-gray-100 bg-gray-50">
                    <form id="comment-form" onsubmit="submitComment(event)" class="flex gap-2">
                        <input type="text" id="comment-input" required class="flex-1 px-4 py-2.5 rounded-full border border-gray-300 focus:border-pink-500 focus:ring-0 text-sm" placeholder="따뜻한 감상평을 남겨주세요...">
                        <button type="submit" class="bg-gradient-to-r from-pink-500 to-violet-500 text-white w-10 h-10 rounded-full flex items-center justify-center hover:opacity-90 transition-all shadow-sm">
                            <i class="fa-solid fa-paper-plane text-sm"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 초기 목업 데이터 (다양한 신규 장르 추가)

        let currentActiveCardId = null;

        // 토스트 알림 함수
        function showToast(message, icon = "fa-check-circle", color = "text-green-400") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `bg-gray-800 text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 animate-pop`;
            toast.innerHTML = `<i class="fa-solid ${icon} ${color} text-lg"></i> <span class="text-sm font-bold">${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // 갤러리 렌더링
        function renderGallery(filterTag = '전체') {
            const grid = document.getElementById('gallery-grid');
            const emptyState = document.getElementById('empty-state');
            grid.innerHTML = '';

            const filteredCards = filterTag === '전체' 
                ? cardsData 
                : cardsData.filter(card => card.tag === filterTag);

            if(filteredCards.length === 0) {
                grid.style.display = 'none';
                emptyState.style.display = 'flex';
                return;
            }

            grid.style.display = 'block';
            emptyState.style.display = 'none';

            // 최신순(역순) 렌더링
            [...filteredCards].reverse().forEach(card => {
                const el = document.createElement('div');
                el.className = 'pin-card bg-white rounded-2xl overflow-hidden cursor-pointer border border-gray-100 shadow-sm relative group animate-fade-in-up';
                el.onclick = () => openDetailModal(card.id);
                
                el.innerHTML = `
                    <div class="relative">
                        <img src="${card.imgUrl}" alt="${card.title}" class="w-full h-auto object-cover">
                        <!-- 오버레이 정보 -->
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-4">
                            <p class="text-white font-bold truncate">${card.title}</p>
                            <p class="text-gray-200 text-xs truncate">by ${card.creator}</p>
                        </div>
                    </div>
                    <div class="p-4 flex justify-between items-center bg-white">
                        <span class="text-xs font-bold text-gray-500 bg-gray-100 px-2 py-1 rounded-md">#${card.tag}</span>
                        <div class="flex items-center gap-3 text-gray-400 text-sm">
                            <span class="flex items-center gap-1"><i class="fa-solid fa-heart text-red-400"></i> ${card.likes}</span>
                            <span class="flex items-center gap-1"><i class="fa-solid fa-comment"></i> ${card.comments.length}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(el);
            });
        }

        // 필터링 동작 (버튼 스타일 화사하게 변경)
        function filterGallery(tag) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-gradient-to-r', 'from-pink-500', 'to-violet-500', 'text-white', 'border-transparent', 'active');
                btn.classList.add('bg-white/80', 'text-slate-600', 'border-slate-200');
            });
            event.target.classList.remove('bg-white/80', 'text-slate-600', 'border-slate-200');
            event.target.classList.add('bg-gradient-to-r', 'from-pink-500', 'to-violet-500', 'text-white', 'border-transparent', 'active');

            renderGallery(tag);
        }

        // 업로드 모달 제어
        let tempImageUrl = '';
        
        function openUploadModal() {
            document.getElementById('upload-modal').classList.remove('hidden');
        }
        function closeUploadModal() {
            document.getElementById('upload-modal').classList.add('hidden');
            document.getElementById('upload-form').reset();
            document.getElementById('image-preview').classList.add('hidden');
            document.getElementById('image-preview').src = '';
            document.getElementById('upload-placeholder').classList.remove('hidden');
            tempImageUrl = '';
        }

        // 로컬 이미지 썸네일 미리보기 처리
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                // 브라우저 메모리에 임시 URL 생성 (보안상 안전)
                tempImageUrl = URL.createObjectURL(file);
                const preview = document.getElementById('image-preview');
                preview.src = tempImageUrl;
                preview.classList.remove('hidden');
                document.getElementById('upload-placeholder').classList.add('hidden');
            }
        }

        // 작품 제출
        function submitCard(e) {
            e.preventDefault();
            
            if(!tempImageUrl) {
                alert("북카드 이미지를 업로드해주세요.");
                return;
            }

            const newCard = {
                id: Date.now(),
                imgUrl: tempImageUrl,
                title: document.getElementById('up-title').value,
                creator: document.getElementById('up-creator').value,
                tag: document.getElementById('up-tag').value,
                description: document.getElementById('up-desc').value,
                likes: 0,
                comments: []
            };

            cardsData.push(newCard); // 배열에 추가
            renderGallery(); // 전체보기로 리렌더링
            
            // 필터 버튼 '전체'로 강제 리셋
            document.querySelectorAll('.filter-btn')[0].click(); 
            
            closeUploadModal();
            showToast("성공적으로 전시되었습니다! 🎉");
        }

        // 상세(댓글) 모달 제어
        function openDetailModal(id) {
            const card = cardsData.find(c => c.id === id);
            if(!card) return;
            
            currentActiveCardId = id;

            document.getElementById('detail-img').src = card.imgUrl;
            document.getElementById('detail-tag').innerText = `#${card.tag}`;
            document.getElementById('detail-title').innerText = card.title;
            document.getElementById('detail-creator').innerText = card.creator;
            document.getElementById('detail-desc').innerText = card.description;
            
            // 좋아요 버튼 렌더링
            const likeBtn = document.getElementById('detail-like-btn');
            document.getElementById('detail-like-count').innerText = card.likes;
            likeBtn.onclick = () => toggleLike(id);
            
            renderComments(card.comments);

            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detail-modal').classList.add('hidden');
            currentActiveCardId = null;
        }

        // 좋아요 기능 (핑크색 애니메이션)
        function toggleLike(id) {
            const card = cardsData.find(c => c.id === id);
            if(card) {
                card.likes += 1; 
                document.getElementById('detail-like-count').innerText = card.likes;
                
                const icon = document.querySelector('#detail-like-btn i');
                icon.classList.add('text-pink-500', 'scale-125');
                setTimeout(() => icon.classList.remove('scale-125'), 200);
                
                renderGallery(document.querySelector('.filter-btn.active').innerText.replace('보기','').replace('#',''));
            }
        }

        // 댓글 렌더링
        function renderComments(comments) {
            const list = document.getElementById('comment-list');
            list.innerHTML = '';
            
            if(comments.length === 0) {
                list.innerHTML = `<p class="text-center text-gray-400 text-sm mt-10">아직 댓글이 없습니다. 첫 번째 감상평을 남겨주세요!</p>`;
                return;
            }

            comments.forEach(c => {
                const el = document.createElement('div');
                el.className = 'flex gap-3 animate-fade-in-up';
                el.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-pink-100 flex items-center justify-center text-pink-600 font-bold text-xs shrink-0">
                        ${c.name.charAt(0)}
                    </div>
                    <div class="bg-gray-50 rounded-2xl rounded-tl-none p-3 max-w-[85%] border border-gray-100">
                        <span class="font-bold text-gray-800 text-xs mb-1 block">${c.name}</span>
                        <p class="text-sm text-gray-600 break-words">${c.text}</p>
                    </div>
                `;
                list.appendChild(el);
            });
            // 스크롤 맨 아래로
            list.scrollTop = list.scrollHeight;
        }

        // 댓글 작성
        function submitComment(e) {
            e.preventDefault();
            const input = document.getElementById('comment-input');
            const text = input.value.trim();
            if(!text || !currentActiveCardId) return;

            const card = cardsData.find(c => c.id === currentActiveCardId);
            
            // 실제 서비스에서는 로그인한 사용자 이름을 가져옵니다
            card.comments.push({ name: "익명친구", text: text });
            
            input.value = '';
            renderComments(card.comments);
            
            // 백그라운드 갤러리의 댓글 수도 업데이트
            renderGallery(document.querySelector('.filter-btn.active').innerText.replace('보기','').replace('#',''));
        }

        // ESC 키 누르면 모달 닫기
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                closeUploadModal();
                closeDetailModal();
            }
        });

        // 초기 로드 시 전체 갤러리 렌더링
        window.onload = () => renderGallery();

    </script>
</body>
</html>
