<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>울림 프로젝트 - 익명 톡톡 아이디어 월</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Pretendard Variable"', 'Pretendard', '-apple-system', 'sans-serif'] },
                    colors: {
                        pastel: {
                            purple: '#e9d5ff', pink: '#fbcfe8', blue: '#bfdbfe', yellow: '#fef08a', mint: '#bbf7d0'
                        }
                    },
                    animation: {
                        'float': 'float 3s ease-in-out infinite',
                        'pop': 'pop 0.3s ease-out forwards'
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-5px)' }
                        },
                        pop: {
                            '0%': { transform: 'scale(0.9)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' }
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            background-image: radial-gradient(#e2e8f0 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            min-height: 100vh;
            color: #334155;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
        }

        .idea-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            transition: all 0.2s ease;
        }

        .idea-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.06);
        }

        .input-glass {
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        .input-glass:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.95);
            border-color: #A855F7;
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.2);
        }

        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="antialiased p-4 md:p-8 flex flex-col items-center">

    <!-- 토스트 알림 컨테이너 -->
    <div id="toast-container" class="fixed top-6 right-6 z-50 flex flex-col gap-3"></div>

    <header class="w-full max-w-6xl flex flex-col items-center mb-10 text-center animate-pop">
        <span class="bg-purple-100 text-purple-600 text-xs font-bold px-3 py-1 rounded-full mb-3 inline-block">울림 프로젝트</span>
        <h1 class="text-3xl md:text-5xl font-black text-slate-800 tracking-tight mb-3">
            익명 톡톡(Talk-Talk) <span class="text-purple-500">아이디어 월</span> 💡
        </h1>
        <p class="text-slate-500 font-medium md:text-lg max-w-2xl">
            이름은 필요 없어요! 학교생활 중 불편했던 점이나 기발한 아이디어를 가볍게 던져주세요. <br class="hidden md:block">친구들의 의견에 <i class="fa-solid fa-heart text-rose-400"></i> 하트를 눌러 공감할 수 있습니다.
        </p>
    </header>

    <main class="w-full max-w-6xl flex flex-col lg:flex-row gap-8">
        
        <div class="w-full lg:w-1/3">
            <div class="glass-panel rounded-3xl p-6 md:p-8 sticky top-8">
                <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                    <i class="fa-regular fa-paper-plane text-purple-500"></i> 새 아이디어 등록
                </h2>
                
                <form id="idea-form" onsubmit="submitIdea(event)" class="flex flex-col gap-4">
                    <div>
                        <textarea id="idea-text" required rows="4" maxlength="150" placeholder="예: 2층 홈베이스에 기대어 쉴 수 있는 빈백이 있었으면 좋겠어요! (최대 150자)" class="input-glass w-full p-4 rounded-2xl text-slate-800 resize-none"></textarea>
                        <div class="text-right text-xs text-slate-400 mt-1"><span id="char-count">0</span>/150</div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-2">포스트잇 색상</label>
                        <div class="flex gap-3">
                            <label class="cursor-pointer hover:scale-110 transition-transform">
                                <input type="radio" name="color" value="purple" class="peer sr-only" checked>
                                <div class="w-8 h-8 rounded-full bg-purple-100 border-2 border-transparent peer-checked:border-purple-500 shadow-sm"></div>
                            </label>
                            <label class="cursor-pointer hover:scale-110 transition-transform">
                                <input type="radio" name="color" value="pink" class="peer sr-only">
                                <div class="w-8 h-8 rounded-full bg-pink-100 border-2 border-transparent peer-checked:border-pink-500 shadow-sm"></div>
                            </label>
                            <label class="cursor-pointer hover:scale-110 transition-transform">
                                <input type="radio" name="color" value="blue" class="peer sr-only">
                                <div class="w-8 h-8 rounded-full bg-blue-100 border-2 border-transparent peer-checked:border-blue-500 shadow-sm"></div>
                            </label>
                            <label class="cursor-pointer hover:scale-110 transition-transform">
                                <input type="radio" name="color" value="yellow" class="peer sr-only">
                                <div class="w-8 h-8 rounded-full bg-yellow-100 border-2 border-transparent peer-checked:border-yellow-500 shadow-sm"></div>
                            </label>
                            <label class="cursor-pointer hover:scale-110 transition-transform">
                                <input type="radio" name="color" value="mint" class="peer sr-only">
                                <div class="w-8 h-8 rounded-full bg-green-100 border-2 border-transparent peer-checked:border-green-500 shadow-sm"></div>
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="mt-2 bg-slate-800 hover:bg-purple-600 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg transition-colors flex items-center justify-center gap-2">
                        툭! 던지기
                    </button>
                </form>
            </div>
        </div>

        <div class="w-full lg:w-2/3">
            <!-- 정렬 및 필터 바 -->
            <div class="flex justify-between items-center mb-6 px-2">
                <h3 class="text-lg font-bold text-slate-700">등록된 아이디어 <span id="total-ideas" class="text-purple-500">0</span></h3>
                <select id="sort-select" onchange="renderIdeas()" class="bg-white border border-slate-200 text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block p-2">
                    <option value="newest">최신순</option>
                    <option value="popular">공감(하트)순</option>
                </select>
            </div>

            <!-- 아이디어 카드 그리드 -->
            <div id="idea-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5 auto-rows-max">
                <!-- 아이디어 카드가 여기에 자바스크립트로 렌더링 됩니다. -->
            </div>
            
            <!-- 비어있을 때 표시 -->
            <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-slate-400 opacity-80">
                <i class="fa-regular fa-comment-dots text-5xl mb-4"></i>
                <p>아직 등록된 아이디어가 없어요. 첫 번째 목소리를 내주세요!</p>
            </div>
        </div>

    </main>

    <script>
        // 초기 목업 데이터 (학생들이 빈 화면을 보지 않도록 샘플 제공)
        let ideas = [
            { id: 1, text: "체육복 등교를 전면 허용해 주시면 아침마다 옷 갈아입는 시간을 단축해서 지각이 줄어들 것 같아요!", color: "yellow", likes: 12, time: "방금 전" },
            { id: 2, text: "급식실 배식 줄이 너무 길어서 점심시간이 부족해요. 학년별 배식 시간을 5분씩만 엇갈리게 조정해보면 어떨까요?", color: "pink", likes: 8, time: "10분 전" },
            { id: 3, text: "도서관에 만화로 된 교양 서적이 더 많아졌으면 좋겠습니다. 접근성이 좋아질 것 같아요.", color: "blue", likes: 3, time: "30분 전" }
        ];

        // 텍스트 글자 수 세기
        document.getElementById('idea-text').addEventListener('input', function(e) {
            document.getElementById('char-count').innerText = e.target.value.length;
        });

        // 토스트 알림 함수
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `bg-slate-800 text-white px-5 py-3 rounded-xl shadow-lg flex items-center gap-3 animate-pop`;
            toast.innerHTML = `<i class="fa-solid fa-check-circle text-green-400"></i> <span class="text-sm font-bold">${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // 색상 매핑 함수 (Tailwind 클래스 적용을 위함)
        function getColorClasses(colorName) {
            const colors = {
                purple: 'bg-purple-50 border-purple-100',
                pink: 'bg-pink-50 border-pink-100',
                blue: 'bg-blue-50 border-blue-100',
                yellow: 'bg-yellow-50 border-yellow-100',
                mint: 'bg-green-50 border-green-100'
            };
            return colors[colorName] || colors.purple;
        }

        // 아이디어 제출
        function submitIdea(e) {
            e.preventDefault();
            const textInput = document.getElementById('idea-text');
            const text = textInput.value.trim();
            const color = document.querySelector('input[name="color"]:checked').value;
            
            if (!text) return;

            const newIdea = {
                id: Date.now(),
                text: text,
                color: color,
                likes: 0,
                time: "방금 전"
            };

            ideas.unshift(newIdea); // 배열 맨 앞에 추가
            
            // 폼 초기화
            textInput.value = '';
            document.getElementById('char-count').innerText = '0';
            
            renderIdeas();
            showToast("아이디어가 월에 등록되었습니다!");
        }

        // 하트(공감) 누르기
        function toggleLike(id) {
            const idea = ideas.find(i => i.id === id);
            if(idea) {
                // 이 간단한 버전에서는 누를 때마다 올라가게 합니다. (실제 서비스에선 localStorage 등으로 중복 방지)
                idea.likes += 1; 
                renderIdeas();
                
                // 클릭한 하트에 간단한 애니메이션 효과
                const heartBtn = document.getElementById(`heart-${id}`);
                if(heartBtn) {
                    heartBtn.classList.add('text-rose-500', 'scale-125');
                    setTimeout(() => heartBtn.classList.remove('scale-125'), 200);
                }
            }
        }

        // 아이디어 렌더링
        function renderIdeas() {
            const grid = document.getElementById('idea-grid');
            const emptyState = document.getElementById('empty-state');
            const sortVal = document.getElementById('sort-select').value;
            
            document.getElementById('total-ideas').innerText = ideas.length;

            if (ideas.length === 0) {
                grid.innerHTML = '';
                grid.style.display = 'none';
                emptyState.style.display = 'flex';
                return;
            }

            grid.style.display = 'grid';
            emptyState.style.display = 'none';
            grid.innerHTML = '';

            // 정렬
            let sortedIdeas = [...ideas];
            if (sortVal === 'popular') {
                sortedIdeas.sort((a, b) => b.likes - a.likes);
            } else {
                // 최신순은 배열 역순(기본적으로 unshift 하므로)
                sortedIdeas.sort((a, b) => b.id - a.id);
            }

            // 카드 생성
            sortedIdeas.forEach((idea) => {
                const cardClasses = getColorClasses(idea.color);
                const el = document.createElement('div');
                el.className = `idea-card rounded-3xl p-6 flex flex-col justify-between animate-pop ${cardClasses}`;
                
                el.innerHTML = `
                    <div class="mb-4">
                        <i class="fa-solid fa-quote-left text-slate-300 text-xl mb-2 block"></i>
                        <p class="text-slate-700 font-medium leading-relaxed break-words">${idea.text}</p>
                    </div>
                    <div class="flex justify-between items-end border-t border-slate-200/50 pt-3 mt-2">
                        <span class="text-xs text-slate-400 font-medium"><i class="fa-regular fa-clock"></i> ${idea.time}</span>
                        <button onclick="toggleLike(${idea.id})" class="flex items-center gap-1.5 text-slate-400 hover:text-rose-500 transition-all group">
                            <i id="heart-${idea.id}" class="fa-solid fa-heart text-lg transition-transform duration-200 group-hover:scale-110 ${idea.likes > 0 ? 'text-rose-400' : ''}"></i>
                            <span class="font-bold text-sm ${idea.likes > 0 ? 'text-rose-500' : ''}">${idea.likes > 0 ? idea.likes : '공감'}</span>
                        </button>
                    </div>
                `;
                grid.appendChild(el);
            });
        }

        // 초기 렌더링
        window.onload = renderIdeas;
    </script>
</body>
</html>
